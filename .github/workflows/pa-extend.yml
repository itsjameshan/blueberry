name: PythonAnywhere 免费站延期

on:
  schedule:
    - cron: "17 3 * * 1"   # 每周一 03:17 UTC（北京时间 11:17）；到期周期是 1 个月，每周点一次足够
  workflow_dispatch:

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/pa_extend.py
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
